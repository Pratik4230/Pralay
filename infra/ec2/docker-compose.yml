services:
  postgres:
    image: postgres:16-alpine
    container_name: pralay-postgres
    environment:
      POSTGRES_USER: pralay
      POSTGRES_PASSWORD: pralay
      POSTGRES_DB: pralay
    ports:
      - "5432:5432"
    volumes:
      - pralay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pralay -d pralay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pralay-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pralay_postgres_data:
